# The Bombadil entrypoint for flutter/samples' compass_app, as a package
# that depends on the unchanged app. setup.sh links the app to out/app.
name: compass_app_bombadil
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  bombadil_flutter:
    path: ../..
  compass_app:
    path: out/app

flutter:
  uses-material-design: true
