[package]
name = "bombadil-linux"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.99"
atspi = { version = "0.30", default-features = false, features = ["connection", "proxies", "tokio"] }
clap = { version = "4.5.46", features = ["derive"] }
futures = "0.3.31"
libc = "0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt", "time", "process", "macros", "io-util"] }

[dev-dependencies]
tempfile = "3.22.0"
